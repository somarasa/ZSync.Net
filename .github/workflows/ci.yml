name: CI & NuGet Pack

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore ZSync.Net.slnx

      - name: Build Solution
        run: dotnet build ZSync.Net.slnx --configuration Release --no-restore

      - name: Download HDiffPatch Reference Binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p reference/hsynz
          curl -sL https://github.com/sisong/hsynz/releases/download/v1.3.0/hsynz_v1.3.0_bin_linux64.zip -o hsynz.zip
          unzip -q -j hsynz.zip "linux64/*" -d reference/hsynz
          chmod +x reference/hsynz/hsync_* reference/hsynz/hsign_*
          rm hsynz.zip

      - name: Download HDiffPatch Reference Binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path reference/hsynz
          Invoke-WebRequest -Uri https://github.com/sisong/hsynz/releases/download/v1.3.0/hsynz_v1.3.0_bin_windows64.zip -OutFile hsynz.zip
          Expand-Archive -Path hsynz.zip -DestinationPath temp_hsynz -Force
          Copy-Item -Path temp_hsynz/windows64/* -Destination reference/hsynz/ -Force
          Remove-Item -Recurse -Force temp_hsynz, hsynz.zip

      - name: Run Test Suite
        run: dotnet test ZSync.Net.slnx --configuration Release --no-build --verbosity normal

  pack:
    name: Pack NuGet Packages
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack NuGet Packages
        run: dotnet pack ZSync.Net.slnx --configuration Release --output ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_KEY != ''
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
